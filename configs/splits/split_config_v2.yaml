version: 1

# v2 differs from split_config_v1.yaml ONLY in cluster_file: v1 used a
# singleton placeholder (one cluster per protein, no real homology grouping,
# see docs/phase_z_evidence_audit.md §3.3); v2 uses real MMseqs2 clusters
# (30% identity, >=50% coverage, cov-mode 0) computed on the full Arabidopsis
# reference proteome — see docs/ops/remote_a100_via_lab_jump_host.md and
# data/processed/clusters/protein_clusters_v2.tsv. v1 stays frozen and
# unmodified; this is a new file, not an overwrite.
cluster_split:
  cluster_file: data/processed/clusters/protein_clusters_v2.tsv
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
  seed: 42

known_mechanism_holdout:
  - SlWRKY6
  - SlERF.D2
  - BRG3
