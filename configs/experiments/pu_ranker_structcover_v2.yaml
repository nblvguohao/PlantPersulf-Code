# Phase S0 frozen experiment config — structure-coverage v2 validation.
#
# Paired comparison of PU ranker scoring under two frozen AlphaFold structure
# registry releases (7 vs 2,006 accessions), with five non-tunable ESM-free
# ablation arms. The experiment is additive: it cannot mutate pu_ranker_v1,
# Gate 2, external-validation outputs, or the mutable registry.
#
# Five arms:
#   sequence_only          — [hydrophobicity, cys_density] only (no structure)
#   sequence_coverage_only — coverage binary mask (1.0 if structure registered)
#   sequence_contact       — contact_number_proxy from structure
#   sequence_plddt         — pLDDT from structure
#   sequence_contact_plddt — both contact_number_proxy + pLDDT
#
# All arms are ESM-free and study-context-free. Identical
# rows/splits/seeds/hyperparameters for both releases.
#
# MANDATORY LIMITATION (carried into every downstream claim): both studies are
# from the same laboratory (Romero/Gotor, U. Sevilla), the same tag-switch
# persulfidation chemistry, and the same species (Arabidopsis thaliana).

