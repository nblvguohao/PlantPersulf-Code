  jsonl_log: training.jsonl
  manifest: manifest.json

limitation: |
  INTERNAL MULTISPECIES EVALUATION ONLY. The strict track blocks homologous
  proteins globally but remains an internal split of public studies. It is not
  evidence of external, cross-laboratory, cross-study, cross-crop, or
  prospective generalisation and must never enter Gate 2.
