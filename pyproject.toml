[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantpersulf"
version = "0.0.0"
description = "Traceable plant persulfidation research tooling"
requires-python = ">=3.10,<3.12"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/plantpersulf"]
