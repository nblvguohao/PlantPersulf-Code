   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #272727" x="53.704387" y="64.850564" transform="rotate(-0 53.704387 64.850564)">1. Dataset</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(26.479606 78.716899)">4 species, 5 studies</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(35.264715 85.940238)">389,609 sites</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(33.025934 93.188425)">2,334 positives</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(32.681059 100.513774)">full provenance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #272727" x="133.748301" y="64.850564" transform="rotate(-0 133.748301 64.850564)">2. Benchmark</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(106.867426 78.716899)">6 models, 10 seeds</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(106.698864 85.940238)">within-dataset splits</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(104.459598 93.163577)">literature-comparable</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(112.042973 100.386916)">claim class only</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #ffffff" x="213.792216" y="64.850564" transform="rotate(-0 213.792216 64.850564)">3. Freeze</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(185.876716 78.792461)">weights + features +</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(184.411966 86.088457)">candidates + controls</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(187.430107 93.413805)">SHA256-registered</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(183.635028 100.734649)">co-signed 2026-08-13</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #272727" x="293.83613" y="64.850564" transform="rotate(-0 293.83613 64.850564)">4. Calibration</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(264.029146 78.716899)">mock-blind diagnostic</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(261.785037 86.012894)">20 unseen tomato sites</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(263.509412 93.236233)">7 Arabidopsis controls</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(258.512599 100.459572)">expectations set pre-blind</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #ffffff" x="373.880045" y="64.850564" transform="rotate(-0 373.880045 64.850564)">5. Preregistration</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(346.276967 78.792461)">SAP + analysis plan</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(346.319107 86.195697)">OSF-registered DOI</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(343.383311 93.593702)">primary endpoint fixed</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #ffffff" transform="translate(345.111076 100.889697)">success criteria fixed</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #272727" x="453.92396" y="64.850564" transform="rotate(-0 453.92396 64.850564)">6. Blind cohort</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(421.699944 78.735305)">593 sites assayed blind</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(422.566006 86.0313)">one-sided Fisher exact</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(427.045022 93.254639)">reported regardless</text>
    <text style="font-size: 6.2px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(438.588647 100.550635)">of outcome</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(115.140345 161.080882)">Binding rule — no model, feature, candidate-table, threshold, or control-set change after unblinding;</text>
    <text style="font-size: 6.3px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #272727" transform="translate(136.686345 169.28614)">every artifact hash-verified; negative results and exclusions preserved and archived.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #272727" x="20.164859" y="188.402649" transform="rotate(-0 20.164859 188.402649)">Preregistered decision matrix:</text>
   </g>
   <g id="text_15">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #4d4d4d" x="94.759775" y="197.370196" transform="rotate(-0 94.759775 197.370196)">enrichment met + mechanism</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #42949e" x="94.759775" y="210.429823" transform="rotate(-0 94.759775 210.429823)">upgraded submission target</text>
   </g>
   <g id="text_17">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #4d4d4d" x="253.814173" y="197.370196" transform="rotate(-0 253.814173 197.370196)">enrichment met, no mechanism</text>
   </g>
   <g id="text_18">
    <text style="font-style: italic; font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #42949e" x="253.814173" y="210.455636" transform="rotate(-0 253.814173 210.455636)">resource and validation report</text>
   </g>
   <g id="text_19">
    <text style="font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #4d4d4d" x="412.868571" y="197.370196" transform="rotate(-0 412.868571 197.370196)">enrichment not met</text>
   </g>
   <g id="text_20">
    <text style="font-style: italic; font-size: 5.9px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #42949e" x="412.868571" y="210.465777" transform="rotate(-0 412.868571 210.465777)">negative result, first-class finding</text>
